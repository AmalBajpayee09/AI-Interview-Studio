<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AI Interview Studio · Companion</title><style>
:root{--bg:#0b1020;--panel:#151d31;--line:#2b3850;--text:#f0f1ff;--muted:#9aa8c1;--accent:#8875ff}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}h1{font-size:29px;margin:4px 0 9px}h2{font-size:17px}p{color:var(--muted);line-height:1.6}header{display:flex;align-items:center;justify-content:space-between;background:#0e1527;padding:19px 30px;border-bottom:1px solid var(--line)}header strong{letter-spacing:1px}header strong b{color:#a89dff}header small{color:var(--muted)}.app{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 64px)}aside{padding:22px 13px;border-right:1px solid var(--line);background:#0e1527}aside button{width:100%;border:0;background:transparent;color:#adbad2;text-align:left;padding:13px 16px;border-radius:9px;margin-bottom:5px}aside button.active,aside button:hover{background:#362d6755;color:#d3c9ff}main{padding:35px;max-width:1180px;width:100%}.eyebrow{font-size:10px;color:#b7a2ff;letter-spacing:2px;font-weight:800}.panel{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:17px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:var(--panel);padding:22px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:28px;margin-top:10px}.stat small{color:var(--muted)}textarea,input,select{background:#0d1425;color:var(--text);padding:12px;border:1px solid var(--line);border-radius:8px;width:100%;margin:9px 0}textarea{resize:vertical;line-height:1.6}.btn{padding:11px 15px;background:#7564e8;border:0;border-radius:8px;color:#fff;font-weight:700;margin:6px 7px 6px 0}.btn.secondary{background:#283550}.btn.danger{background:#784159}.answer{white-space:pre-wrap;line-height:1.85;overflow-wrap:anywhere;max-height:600px;overflow-y:auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.entry{border-bottom:1px solid var(--line);padding:13px 0}.entry small{display:block;color:var(--muted);margin-top:5px}.option{display:block;padding:14px;margin:8px 0;border:1px solid var(--line);border-radius:9px;cursor:pointer}.option input{width:auto;margin:0 15px 0 0}.error{color:#ffbcc2;background:#8f374b42;padding:10px;border-radius:8px}.success{color:#8bdfc8}.banner{padding:23px 27px;border-radius:14px;background:linear-gradient(100deg,#4e3b91,#26506c);margin:25px 0}.banner h2{font-size:24px;color:#fff}.tag{color:#b5a6ff;font-size:11px}.hidden{display:none!important}.hint{font-size:11px;color:var(--muted)}.timer{font-size:24px;color:#a7a0ff;font-weight:800}.code{font-family:Consolas,monospace}.navq button{background:#26334d;color:white;border:1px solid var(--line);padding:10px;border-radius:6px;margin-right:7px}.navq button.sel{outline:2px solid #9583fb}@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:flex;overflow-x:auto;padding:8px}aside button{white-space:nowrap;width:auto;margin:0}main{padding:15px}.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:500px){.stats,.grid{grid-template-columns:1fr}header small{display:none}}
</style></head><body><header><strong>✳ AI INTERVIEW <b>STUDIO</b></strong><small>Local-first • Browser companion • Tauri desktop source included</small></header><div class="app"><aside id="menu"></aside><main><div class="eyebrow">AUTHORIZED INTERVIEW PREPARATION</div><h1 id="heading">Overview</h1><p id="subtitle">An integrated practice workspace that runs locally.</p><section id="content"></section><p class="hint">Model answers may be incorrect. Verify important outputs. No secure exam restriction bypass.</p></main></div>
<script>
const API='/api';let sessions=[],activeSession='',lastQuestion='',controller=null,assessments=[],assessment=null,answers={},index=0,started=0,deadline=0,ticker=null,lastPage='Overview';
const titles=['Overview','Live practice','Timed assessments','Coding & DSA','SQL lab','Resume library','Communication','Sessions','Analytics','Diagnostics'];
const $=(id)=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){let r=await fetch(API+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.detail||'Request failed');return x}
function notice(msg,kind='error'){let e=$('notice');if(e){e.className=kind;e.textContent=msg}}
function card(title,body){return `<div class="panel"><h2>${title}</h2>${body}</div>`}
function renderMenu(){ $('menu').innerHTML=titles.map(x=>`<button class="${x===lastPage?'active':''}" data-page="${x}">${x}</button>`).join('');$('menu').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.page))}
async function show(page){lastPage=page;renderMenu();$('heading').textContent=page;const subtitles={'Overview':'Practice, learn, and measure your progress.','Live practice':'Context-aware answers, microphone transcription and document inputs.','Timed assessments':'Scored multiple-choice practice with negative marking.','Coding & DSA':'Static syntax checks and AI-assisted reviews.','SQL lab':'Execute safe read-only queries on a bundled dataset.','Resume library':'Ground responses in user-supplied project notes.','Communication':'Analyze speech transcripts without accent scoring.','Sessions':'Local persistence and deletion.','Analytics':'Measured practice activity, not a psychometric score.','Diagnostics':'Runtime and model availability.'};$('subtitle').textContent=subtitles[page]||'';$('content').innerHTML='<p>Loading…</p>';
try{if(page==='Overview'){let s=await api('/stats');$('content').innerHTML=`<div class="banner"><div class="tag">START PRACTICING</div><h2>Prepare for your next opportunity.</h2><p>Explore ideas, practice under a timer and revisit every answer.</p><button class="btn" id="begin">✦ Start practice →</button></div><div class="stats">${[['Sessions',s.sessions],['Questions',s.questions],['Quizzes completed',s.assessments_completed],['Average quiz score',s.average_score_pct==null?'—':s.average_score_pct+'%']].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`;$('begin').onclick=()=>show('Live practice')}
if(page==='Live practice')await live();if(page==='Timed assessments')await quiz();if(page==='Coding & DSA')coding();if(page==='SQL lab')await sqlLab();if(page==='Resume library')await docs();if(page==='Communication')communication();if(page==='Sessions')await history();if(page==='Analytics')analytics();if(page==='Diagnostics')await diagnostics();}
catch(e){$('content').innerHTML=`<div class="error">${esc(e.message)}. Start the Python worker and retry.</div>`}}
async function live(){sessions=await api('/sessions');$('content').innerHTML=`<div class="grid"><div>${card('Current question',`<label>Session</label><select id="sess"><option value="">New practice session</option>${sessions.map(s=>`<option value="${esc(s.id)}">${esc(s.title)}</option>`).join('')}</select><textarea rows="9" id="question" placeholder="Paste a question, coding prompt, or ask about a system design…"></textarea><label>Answer mode</label><select id="mode">${['short','hint','detailed','code','diagram','verify','follow-up'].map(x=>`<option>${x}</option>`).join('')}</select><label>AI provider</label><select id="provider"><option value="ollama">Local Ollama</option><option value="cloud">Cloud (explicit opt-in)</option></select><input id="model" placeholder="Optional model override"/><div class="row"><button class="btn" id="ask">✦ Generate</button><button class="btn secondary" id="cancel">Cancel</button></div><p>Upload a screenshot, resume, PDF or question file:</p><input type="file" id="file" accept=".pdf,.docx,.txt,.md,image/*"/><button class="btn secondary" id="mic">◉ Record microphone</button><p class="hint">Stop recording to transcribe. Optional faster-whisper model required. Please verify transcripts.</p><div id="notice"></div>`)}</div><div>${card('AI response',`<div class="tag" id="meta">Not independently verified</div><div class="answer" id="answer" style="min-height:180px">Select a provider and generate a response. Previous turns in the same session are sent for context.</div>`)}${card('Session history','<div id="turns">Choose a session to see its saved answers.</div>')}</div></div>`;
if(activeSession)$('sess').value=activeSession;if(lastQuestion)$('question').value=lastQuestion;
async function getTurns(){if(!$('sess').value){$('turns').textContent='No session selected';return}let turns=await api('/sessions/'+$('sess').value+'/turns');$('turns').innerHTML=turns.slice().reverse().map(t=>`<div class="entry"><strong>${esc(t.question)}</strong><small>${t.elapsed_ms} ms · ${esc(t.mode)}</small><details><summary>Show answer</summary><p>${esc(t.answer)}</p></details></div>`).join('')||'No answers yet'};
$('sess').onchange=()=>{activeSession=$('sess').value;getTurns()};await getTurns();
$('ask').onclick=async()=>{lastQuestion=$('question').value;if(!lastQuestion.trim()){notice('Type a question');return}try{if(!activeSession){let s=await api('/sessions','POST',{title:lastQuestion.slice(0,55)});activeSession=s.id;$('sess').innerHTML+=`<option value="${esc(s.id)}">${esc(s.title)}</option>`;$('sess').value=s.id}controller=new AbortController();$('ask').disabled=true;$('answer').textContent='';$('meta').textContent='Generating…';let r=await fetch(API+'/ask/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:activeSession,question:lastQuestion,mode:$('mode').value,provider:$('provider').value,model:$('model').value||null}),signal:controller.signal});if(!r.ok)throw Error((await r.json()).detail);let reader=r.body.getReader(),dec=new TextDecoder(),buf='';while(true){let chunk=await reader.read();if(chunk.done)break;buf+=dec.decode(chunk.value,{stream:true});let end;while((end=buf.indexOf('\n\n'))>=0){let line=buf.slice(0,end);buf=buf.slice(end+2);if(line.startsWith('data: ')){let item=JSON.parse(line.slice(6));if(item.type==='token')$('answer').textContent+=item.text;if(item.type==='meta')$('meta').textContent=item.category+' · '+item.model;if(item.type==='done'){$('meta').textContent+=' · '+item.elapsed_ms+' ms';getTurns()}if(item.type==='error')notice(item.message)}}}}catch(e){if(e.name!=='AbortError')notice(e.message)}finally{controller=null;$('ask').disabled=false}};
$('cancel').onclick=()=>controller?.abort();$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;try{let form=new FormData();form.append('file',f);let r=await fetch(API+'/files/extract',{method:'POST',body:form});let d=await r.json();if(!r.ok)throw Error(d.detail);$('question').value+=('\n'+d.text);notice(d.extraction+'; verify extracted text','success')}catch(e){notice(e.message)}};
let recorder=null,parts=[],stream=null;$('mic').onclick=async()=>{if(recorder){recorder.stop();$('mic').textContent='◉ Record microphone';recorder=null;return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});parts=[];const rec=new MediaRecorder(stream);recorder=rec;rec.ondataavailable=e=>parts.push(e.data);rec.onstop=async()=>{stream.getTracks().forEach(x=>x.stop());let form=new FormData();form.append('file',new Blob(parts,{type:rec.mimeType}),'practice.webm');try{let r=await fetch(API+'/transcribe',{method:'POST',body:form});let d=await r.json();if(!r.ok)throw Error(d.detail);$('question').value+=(' '+d.text);notice('Transcription added; verify text.','success')}catch(e){notice(e.message)}};rec.start();$('mic').textContent='■ Stop recording'}catch(e){notice('Microphone unavailable: '+e.message)}};}
async function quiz(){assessments=await api('/assessments');$('content').innerHTML=assessments.map(a=>card(esc(a.title),`<p>${a.questions.length} questions · ${Math.ceil(a.duration_seconds/60)} minutes</p><button class="btn" data-a="${a.id}">Start timed quiz</button>`)).join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>startQuiz(assessments.find(a=>a.id===b.dataset.a)))}
async function startQuiz(a){
 assessment=a;answers={};index=0;started=Date.now()/1000;
 try{let saved=await api('/assessments/'+a.id+'/draft');if(saved.draft){answers=saved.draft.answers;started=saved.draft.started}}catch(e){console.warn('Draft unavailable:',e.message)}
 deadline=started*1000+a.duration_seconds*1000;quizQuestion();ticker=setInterval(()=>{const t=$('timer');if(t)t.textContent=Math.max(0,Math.ceil((deadline-Date.now())/1000))+'s remaining';if(Date.now()>=deadline){clearInterval(ticker);finishQuiz()}},500)}
function quizQuestion(){let q=assessment.questions[index];$('content').innerHTML=card(esc(assessment.title),`<div class="row"><strong>Question ${index+1} / ${assessment.questions.length}</strong><span class="timer" id="timer">${Math.max(0,Math.ceil((deadline-Date.now())/1000))}s remaining</span></div><h2>${esc(q.stem)}</h2>${q.options.map(o=>`<label class="option"><input name="option" type="radio" value="${esc(o.label)}" ${answers[q.id]===o.label?'checked':''}/>${esc(o.label)}. ${esc(o.text)}</label>`).join('')}<div class="navq">${assessment.questions.map((x,i)=>`<button data-idx="${i}" class="${i===index?'sel':''}">${i+1}${answers[x.id]?' ✓':''}</button>`).join('')}</div><div><button class="btn secondary" id="prev">← Previous</button><button class="btn secondary" id="next">Next →</button><button class="btn" id="submit">Submit quiz</button></div><p class="hint">-0.25 penalty per incorrect response; unanswered no penalty.</p><div id="notice"></div>`);
 document.querySelectorAll('input[name=option]').forEach(x=>x.onchange=()=>{answers[q.id]=x.value;api('/assessments/'+assessment.id+'/draft','POST',{answers,review:[],started}).catch(e=>notice('Autosave failed: '+e.message))});document.querySelectorAll('[data-idx]').forEach(b=>b.onclick=()=>{index=+b.dataset.idx;quizQuestion()});$('prev').onclick=()=>{index=Math.max(0,index-1);quizQuestion()};$('next').onclick=()=>{index=Math.min(assessment.questions.length-1,index+1);quizQuestion()};$('submit').onclick=finishQuiz}
async function finishQuiz(){clearInterval(ticker);try{let r=await api('/assessments/'+assessment.id+'/submit','POST',{answers,started,negative_marking:.25});$('content').innerHTML=card('Assessment report',`<h1>${r.percent}%</h1><p>${r.correct} correct, ${r.incorrect} incorrect, ${r.unanswered} unanswered · score ${r.score}/${r.maximum}</p>${r.explanations.map(x=>`<div class="entry"><strong>${esc(x.id)} · Correct: ${esc(x.correct)}</strong><p>${esc(x.explanation)}</p></div>`).join('')}<button class="btn" id="back">Back to assessments</button>`);$('back').onclick=()=>show('Timed assessments')}catch(e){notice(e.message)}}
function coding(){$('content').innerHTML=card('Syntax inspector',`<p>Static Python AST analysis only. This does not run code or verify hidden tests.</p><select id="lang"><option value="python">Python</option><option value="javascript">JavaScript</option><option value="java">Java</option><option value="cpp">C++</option></select><textarea class="code" rows="16" id="code">def solve(nums):\n    return sorted(nums)</textarea><button class="btn" id="check">✓ Validate syntax</button><button class="btn secondary" id="review">✦ AI code review</button><div id="notice"></div>`);$('check').onclick=async()=>{try{let r=await api('/code/check','POST',{code:$('code').value,language:$('lang').value});notice(r.status+': '+r.message,r.status==='parsed'?'success':'error')}catch(e){notice(e.message)}};$('review').onclick=()=>{lastQuestion='Review the following '+$('lang').value+' code and discuss correctness, complexity and edge cases:\n'+$('code').value;show('Live practice')}}
async function sqlLab(){let s=await api('/sql/schema');$('content').innerHTML=`<div class="grid">${card('SQL editor',`<textarea class="code" id="sql" rows="12">SELECT name,salary FROM employees ORDER BY salary DESC;</textarea><button class="btn" id="runsql">Run read-only query</button><div id="notice"></div>`)}${card('Dataset schema',s.tables.map(t=>`<div class="entry"><strong>${esc(t.table)}</strong><p>${esc(t.columns.join(', '))}</p></div>`).join(''))}</div><div id="sqlresult"></div>`;
 $('runsql').onclick=async()=>{try{let x=await api('/sql/query','POST',{query:$('sql').value,max_rows:100});$('sqlresult').innerHTML=card('Verified SQL results',`<p>${x.row_count} rows (${x.elapsed_ms} ms) ${x.truncated?'· truncated':''}</p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr>${x.columns.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${x.rows.map(row=>`<tr>${row.map(v=>`<td style="padding:8px;border-bottom:1px solid #334">${esc(v===null?'NULL':v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);notice('Executed against the bundled, read-only practice dataset','success')}catch(e){notice(e.message)}}
}
async function docs(){let docs=await api('/documents');$('content').innerHTML=`<div class="grid">${card('Import knowledge',`<input type="file" id="file" accept=".pdf,.docx,.txt,image/*"/><input id="fname" value="notes.txt"/><textarea id="body" rows="12" placeholder="Paste resume/project notes or extract a file…"></textarea><button class="btn" id="save">Save locally</button><div id="notice"></div>`)}${card('Saved materials',docs.map(d=>`<div class="entry"><strong>${esc(d.filename)}</strong><small>${d.size} characters</small><button class="btn danger" data-del="${d.id}">Delete</button></div>`).join('')||'<p>No documents saved.</p>')}</div>`;
$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;let form=new FormData();form.append('file',f);try{let r=await fetch(API+'/files/extract',{method:'POST',body:form});let d=await r.json();if(!r.ok)throw Error(d.detail);$('body').value=d.text;$('fname').value=d.filename;notice('Extracted; please verify before saving.','success')}catch(e){notice(e.message)}};$('save').onclick=async()=>{try{await api('/documents','POST',{filename:$('fname').value,content:$('body').value});show('Resume library')}catch(e){notice(e.message)}};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api('/documents/'+b.dataset.del,'DELETE');show('Resume library')})}
function communication(){$('content').innerHTML=card('Delivery metrics',`<textarea id="transcript" rows="9" placeholder="Paste a spoken response transcript…"></textarea><label>Duration in seconds</label><input type="number" id="secs" value="60" min="1"/><button class="btn" id="analyze">Analyze transcript</button><div id="results"></div><div id="notice"></div>`);$('analyze').onclick=async()=>{try{let x=await api('/communication/feedback','POST',{transcript:$('transcript').value,seconds:Number($('secs').value)});$('results').innerHTML=`<div class="stats">${[['Words',x.words],['Words/min',x.wpm],['Fillers',x.fillers]].map(a=>`<div class="stat"><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div><p>${esc(x.feedback)}</p>`}catch(e){notice(e.message)}}}
async function history(){let ss=await api('/sessions');$('content').innerHTML=card('Saved practice sessions',ss.map(s=>`<div class="entry"><strong>${esc(s.title)}</strong><small>${new Date(s.updated*1000).toLocaleString()}</small><button class="btn secondary" data-open="${s.id}">Open</button><button class="btn danger" data-del="${s.id}">Delete</button></div>`).join('')||'<p>No practice sessions yet.</p>');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{activeSession=b.dataset.open;show('Live practice')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api('/sessions/'+b.dataset.del,'DELETE');if(activeSession===b.dataset.del)activeSession='';show('Sessions')})}
async function analytics(){let s=await api('/stats');$('content').innerHTML=card('Recorded performance',`<div class="stats">${[['Sessions',s.sessions],['Questions',s.questions],['Quizzes',s.assessments_completed],['Mean AI latency (ms)',s.average_answer_ms]].map(a=>`<div class="stat"><small>${a[0]}</small><b>${a[1]}</b></div>`).join('')}</div><p>Average quiz score: ${s.average_score_pct??'N/A'}%. Only instrumented data is shown.</p><button class="btn secondary" id="export">Export JSON</button><a class="btn secondary" href="/api/backup/database" download="ai-interview-studio-backup.sqlite3">Download SQLite backup</a>`);$('export').onclick=async()=>{let data=await api('/export');let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='studio-practice-export.json';a.click();URL.revokeObjectURL(url)}}
async function diagnostics(){let d=await api('/diagnostics'),m=await api('/models');$('content').innerHTML=card('Runtime diagnostics',`<div class="grid"><div><p>CPU: ${esc(d.cpu_count)} logical cores</p><p>Memory: ${esc(d.memory_available_gb)} / ${esc(d.memory_total_gb)} GB available</p><p>Worker RSS: ${esc(d.process_rss_mb)} MB</p><p>Profile: ${esc(d.profile)}</p></div><div><p>Ollama online: ${m.online?'Yes':'No'}</p><p>Local models: ${esc(m.models.join(', ')||'None detected')}</p><p>Cloud enabled: ${m.cloud_enabled?'Yes':'No'}</p><p>GPU: ${esc(d.gpu_execution)}</p></div></div><p>To enable cloud provider, edit .env and restart the worker; never paste API keys in this browser.</p>`) }
show('Overview');
</script></body></html>
