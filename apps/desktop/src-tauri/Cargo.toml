[package]
name = "ai-interview-studio"
version = "1.0.0-rc.4"
edition = "2021"
description = "Authorized interview practice desktop application"

[lib]
name = "ai_interview_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.4", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
