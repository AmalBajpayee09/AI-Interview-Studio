name: Windows v0.8 native build, worker and installer validation
on:
  workflow_dispatch:
  push:
    branches: ["feature/v0.8.0-integration-hardening"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source and toolchains
        run: |
          foreach($required in @('apps/desktop/package-lock.json','apps/desktop/src-tauri/src/lib.rs','services/ai_worker/run_worker.py','scripts/build.ps1')) {
            if(-not (Test-Path $required)){throw "Missing required file: $required"}
          }
          node --version; npm --version; rustc --version; cargo --version; py -3.11 --version
      - name: Python dependencies
        run: |
          py -3.11 -m venv services/ai_worker/.venv
          & services/ai_worker/.venv/Scripts/python.exe -m pip install -r services/ai_worker/requirements.txt
          & services/ai_worker/.venv/Scripts/python.exe -m pip install -r services/ai_worker/requirements-stt.txt
      - name: Export exact-commit source archive
        run: |
          git archive --format=zip HEAD -o AI-Interview-Studio-Source-v0.8.0.zip
          if($LASTEXITCODE -ne 0){throw 'Git source archive failed'}
      - name: Python regression tests and compilation
        run: |
          $env:PYTHONPATH='services/ai_worker'
          & services/ai_worker/.venv/Scripts/python.exe -m compileall -q services/ai_worker/app
          if ($LASTEXITCODE -ne 0){throw 'Python compileall failed'}
          & services/ai_worker/.venv/Scripts/python.exe -m pytest services/ai_worker/tests -q --junitxml=python-test-results.xml
          if ($LASTEXITCODE -ne 0){throw 'Python regression tests failed'}
      - name: Frontend reproducible install and production build
        working-directory: apps/desktop
        run: |
          npm ci
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm run build
          if($LASTEXITCODE -ne 0){throw 'React production build failed'}
      - name: Rust checks and tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check
          if($LASTEXITCODE -ne 0){throw 'cargo check failed'}
          cargo test
          if($LASTEXITCODE -ne 0){throw 'cargo test failed'}
      - name: Package Python worker and NSIS installer
        run: .\scripts\build.ps1
      - name: Standalone packaged-worker authenticated health smoke
        run: |
          $ErrorActionPreference='Stop'
          $worker='services/ai_worker/dist/ai-studio-worker.exe'
          if(-not (Test-Path $worker)){throw 'Missing packaged Python worker'}
          $listener=[System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,0)
          $listener.Start(); $port=$listener.LocalEndpoint.Port; $listener.Stop()
          $env:STUDIO_PORT="$port"
          $env:STUDIO_WORKER_TOKEN='ci-worker-auth-token-v08'
          $env:STUDIO_DATA_DIR=Join-Path $env:RUNNER_TEMP 'AIStudioV08WorkerData'
          $stderr=Join-Path $env:RUNNER_TEMP 'v08-worker-stderr.txt'
          $stdout=Join-Path $env:RUNNER_TEMP 'v08-worker-stdout.txt'
          $proc=Start-Process -FilePath (Resolve-Path $worker) -PassThru -RedirectStandardError $stderr -RedirectStandardOutput $stdout
          try {
            $online=$false
            for($i=0;$i -lt 50;$i++) {
              Start-Sleep -Milliseconds 300
              $proc.Refresh()
              if($proc.HasExited){throw "Packaged worker exited unexpectedly: $($proc.ExitCode)"}
              try {
                $r=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -Headers @{'X-Studio-Token'=$env:STUDIO_WORKER_TOKEN} -TimeoutSec 2
                if($r.status -eq 'ok' -and $r.version -eq '0.8.0'){$online=$true; break}
              }catch {}
            }
            if(-not $online){throw 'Packaged worker never became healthy'}
            "STANDALONE_WORKER_READY=$port" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            & services/ai_worker/.venv/Scripts/python.exe -c "import sqlite3,os; db=sqlite3.connect(os.path.join(os.environ['STUDIO_DATA_DIR'],'studio.sqlite3')); assert db.execute('PRAGMA user_version').fetchone()[0]>=5; print('Standalone worker database OK')"
            if($LASTEXITCODE -ne 0){throw 'Worker SQLite migration failed'}
          }finally {
            if(-not $proc.HasExited){$proc.Kill($true);$proc.WaitForExit()}
            if(Test-Path $stderr){Get-Content $stderr -Tail 60 | ForEach-Object {Write-Host $_}}
          }
      - name: Validate installer output
        run: |
          $exes=@(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if($exes.Count -eq 0){throw 'No NSIS installer produced'}
          $exes | ForEach-Object {Get-FileHash $_.FullName -Algorithm SHA256 | Format-List}
      - name: Install and verify desktop launch and worker
        run: |
          $ErrorActionPreference='Stop'
          $exe=@(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe')[0]
          $dest=Join-Path $env:RUNNER_TEMP 'AIStudioV08Installed'
          $install=Start-Process -FilePath $exe.FullName -ArgumentList @('/S',"/D=$dest") -PassThru -Wait
          if($install.ExitCode -ne 0){throw "NSIS install returned $($install.ExitCode)"}
          $desktop=@(Get-ChildItem $dest -Filter 'ai-interview-studio.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)
          $worker=@(Get-ChildItem $dest -Filter 'ai-studio-worker.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)
          if($desktop.Count -eq 0 -or $worker.Count -eq 0){throw 'Installed app or worker missing'}
          $env:STUDIO_DATA_DIR=Join-Path $env:RUNNER_TEMP 'AIStudioV08InstalledData'
          $app=Start-Process -FilePath $desktop[0].FullName -PassThru
          try {
            Start-Sleep -Seconds 12
            $app.Refresh()
            if($app.HasExited){throw "Desktop exited early: $($app.ExitCode)"}
            $workers=@(Get-CimInstance Win32_Process -Filter "Name='ai-studio-worker.exe'" )
            if($workers.Count -lt 1){
              $logDir=Join-Path $env:LOCALAPPDATA 'com.interviewstudio.desktop/logs'
              Write-Warning "Worker process not observed. Logs expected near $logDir"
              if(Test-Path $logDir){Get-ChildItem $logDir -Recurse | ForEach-Object {Write-Host $_.FullName; if(-not $_.PSIsContainer){Get-Content $_.FullName -Tail 50}}}
              throw 'Bundled desktop worker did not remain running'
            }
            $dbfile=Join-Path $env:STUDIO_DATA_DIR 'studio.sqlite3'
            if(-not (Test-Path $dbfile)){throw 'Installed-app SQLite not created'}
            $env:AI_STUDIO_TEST_DB=$dbfile
            & services/ai_worker/.venv/Scripts/python.exe -c "import sqlite3,os; c=sqlite3.connect(os.environ['AI_STUDIO_TEST_DB']); assert c.execute('PRAGMA user_version').fetchone()[0]>=5; print('Installed-app SQLite schema OK')"
            if($LASTEXITCODE -ne 0){throw 'Installed SQLite schema check failed'}
          }finally {
            if(-not $app.HasExited){$null=$app.CloseMainWindow(); Start-Sleep -Seconds 2; $app.Refresh(); if(-not $app.HasExited){$app.Kill($true);$app.WaitForExit()}}
          }
      - name: Upload test logs and actual installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-v08-build-and-test-evidence
          path: |
            python-test-results.xml
            AI-Interview-Studio-Source-v0.8.0.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/dist/
            ${{ runner.temp }}/v08-worker-stderr.txt
            ${{ runner.temp }}/v08-worker-stdout.txt
          if-no-files-found: warn
