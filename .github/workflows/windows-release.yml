name: Windows v0.9 authenticated worker and release acceptance
on:
  workflow_dispatch:
  push:
    branches: ["feature/v0.10.0-docker-execution"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact source, lockfile and toolchains
        run: |
          $ErrorActionPreference='Stop'
          foreach($required in @('apps/desktop/package-lock.json','apps/desktop/src-tauri/src/lib.rs','services/ai_worker/run_worker.py','services/ai_worker/app/startup_events.py','services/ai_worker/tests/test_v09.py','scripts/build.ps1')) {
            if(-not (Test-Path $required)){throw "Missing required file: $required"}
          }
          "Source commit: $env:GITHUB_SHA" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          node --version; npm --version; rustc --version; cargo --version; py -3.11 --version
      - name: Python dependencies
        run: |
          py -3.11 -m venv services/ai_worker/.venv
          & services/ai_worker/.venv/Scripts/python.exe -m pip install -r services/ai_worker/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'Python dependency installation failed'}
          & services/ai_worker/.venv/Scripts/python.exe -m pip install -r services/ai_worker/requirements-stt.txt
          if($LASTEXITCODE -ne 0){throw 'STT dependency installation failed'}
      - name: Python regression, real localhost restart and compilation
        run: |
          $env:PYTHONPATH='services/ai_worker'
          & services/ai_worker/.venv/Scripts/python.exe -m compileall -q services/ai_worker/app
          if($LASTEXITCODE -ne 0){throw 'Python compilation failed'}
          & services/ai_worker/.venv/Scripts/python.exe -m pytest services/ai_worker/tests -q --junitxml=python-test-results.xml
          if($LASTEXITCODE -ne 0){throw 'Python regression failed'}
      - name: Frontend locked dependencies and production build
        working-directory: apps/desktop
        run: |
          npm ci
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm run build
          if($LASTEXITCODE -ne 0){throw 'TypeScript / React build failed'}
      - name: Rust compilation and unit tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check
          if($LASTEXITCODE -ne 0){throw 'cargo check failed'}
          cargo test
          if($LASTEXITCODE -ne 0){throw 'Rust tests failed'}
      - name: Package bundled worker and NSIS installer
        run: .\scripts\build.ps1
      - name: Authenticated packaged Python worker acceptance
        run: |
          $ErrorActionPreference='Stop'
          $worker='services/ai_worker/dist/ai-studio-worker.exe'
          if(-not (Test-Path $worker)){throw 'Packaged worker missing'}
          $listener=[System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,0)
          $listener.Start();$port=$listener.LocalEndpoint.Port;$listener.Stop()
          $env:STUDIO_PORT="$port"
          $env:STUDIO_WORKER_TOKEN='ci-only-secret-not-published'
          $env:STUDIO_DATA_DIR=Join-Path $env:RUNNER_TEMP 'AIStudioV09StandaloneData'
          $env:STUDIO_DIAGNOSTIC_DIR=Join-Path $env:RUNNER_TEMP 'AIStudioV09StandaloneLogs'
          $stderr=Join-Path $env:RUNNER_TEMP 'v09-worker-stderr.txt'
          $proc=Start-Process -FilePath (Resolve-Path $worker) -PassThru -RedirectStandardError $stderr
          try {
            $ready=$false;$stopwatch=[System.Diagnostics.Stopwatch]::StartNew()
            while($stopwatch.Elapsed.TotalSeconds -lt 35){
              $proc.Refresh()
              if($proc.HasExited){throw "Packaged worker exited before readiness: $($proc.ExitCode)"}
              try {
                $bad=Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -SkipHttpErrorCheck -TimeoutSec 2
                if([int]$bad.StatusCode -ne 401){throw 'Unauthenticated health request was not rejected'}
                $r=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -Headers @{'X-Studio-Token'=$env:STUDIO_WORKER_TOKEN} -TimeoutSec 2
                if($r.status -eq 'ok' -and $r.version -eq '0.9.0'){$ready=$true;break}
              }catch {
                if($_.Exception.Message -match 'Unauthenticated health'){throw}
              }
              Start-Sleep -Milliseconds 250
            }
            if(-not $ready){throw 'Packaged worker did not complete authenticated readiness'}
            if(-not (Test-Path (Join-Path $env:STUDIO_DATA_DIR 'studio.sqlite3'))){throw 'Worker SQLite missing'}
            $events=Get-Content (Join-Path $env:STUDIO_DIAGNOSTIC_DIR 'worker-startup.jsonl') -Raw
            if($events -notmatch 'database_initialized'){throw 'No worker database initialization event'}
            if($events -match [regex]::Escape($env:STUDIO_WORKER_TOKEN)){throw 'Worker diagnostics leaked auth token'}
            "Packaged worker authenticated readiness: $($stopwatch.ElapsedMilliseconds) ms" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }finally {
            if(-not $proc.HasExited){$proc.Kill($true);$proc.WaitForExit()}
            Remove-Item Env:STUDIO_WORKER_TOKEN -ErrorAction SilentlyContinue
          }
      - name: Generate exact-commit source and validate installer
        run: |
          git archive --format=zip HEAD -o AI-Interview-Studio-Source-v0.9.0.zip
          if($LASTEXITCODE -ne 0){throw 'Canonical source ZIP failed'}
          $exes=@(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if($exes.Count -lt 1){throw 'No actual NSIS installer produced'}
          $exes | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "Windows NSIS: $($_.Name) SHA256 $hash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Write-Host "NSIS_SHA256=$hash"
          }
      - name: Install, authenticate, restart and validate retained SQLite on Windows
        run: |
          $ErrorActionPreference='Stop'
          $installer=@(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe')[0]
          $dest=Join-Path $env:RUNNER_TEMP 'AIStudioV09 Installed Path With Spaces'
          $install=Start-Process -FilePath $installer.FullName -ArgumentList @('/S',"/D=$dest") -PassThru -Wait
          if($install.ExitCode -ne 0){throw "Silent install failed: $($install.ExitCode)"}
          $desktop=@(Get-ChildItem $dest -Filter 'ai-interview-studio.exe' -Recurse | Select-Object -First 1)
          $worker=@(Get-ChildItem $dest -Filter 'ai-studio-worker.exe' -Recurse | Select-Object -First 1)
          if($desktop.Count -lt 1 -or $worker.Count -lt 1){throw 'Installed desktop or worker executable missing'}
          $env:STUDIO_DATA_DIR=Join-Path $env:RUNNER_TEMP 'AIStudioV09 Persistent SQLite'
          $marker=Join-Path $env:LOCALAPPDATA 'com.interviewstudio.desktop/logs/worker-readiness.json'
          $env:V09_MARKER=$marker
          $env:V09_INSTALL_DIR=$dest
          "V09_INSTALL_DIR=$dest" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $originalPid=0
          for($relaunch=0;$relaunch -lt 2;$relaunch++){
            Remove-Item $marker -Force -ErrorAction SilentlyContinue
            $started=Get-Date
            $app=Start-Process -FilePath $desktop[0].FullName -PassThru
            try {
              $ready=$false;$watch=[System.Diagnostics.Stopwatch]::StartNew()
              while($watch.Elapsed.TotalSeconds -lt 65){
                $app.Refresh()
                if($app.HasExited){throw "Installed desktop exited early: $($app.ExitCode)"}
                if(Test-Path $marker){
                  try {
                    $status=Get-Content $marker -Raw | ConvertFrom-Json
                    if($status.app_version -eq '0.9.0' -and $status.authenticated -eq $true -and $status.stage -eq 'ready'){
                      $workerPid=[int]$status.worker_pid
                      if($workerPid -le 0 -or -not (Get-Process -Id $workerPid -ErrorAction SilentlyContinue)){
                        throw 'Readiness marker refers to a dead worker'
                      }
                      $ready=$true;break
                    }
                  }catch {
                    if($_.Exception.Message -match 'dead worker'){throw}
                  }
                }
                Start-Sleep -Milliseconds 250
              }
              if(-not $ready){throw 'Desktop never established authenticated worker readiness'}
              $db=Join-Path $env:STUDIO_DATA_DIR 'studio.sqlite3'
              if(-not (Test-Path $db)){throw 'Installed desktop did not initialize SQLite'}
              $env:V09_SQLITE_DB=$db
              & services/ai_worker/.venv/Scripts/python.exe -c "import sqlite3,os; p=os.environ['V09_SQLITE_DB']; c=sqlite3.connect(p); assert c.execute('PRAGMA user_version').fetchone()[0]>=5; c.close()"
              if($LASTEXITCODE -ne 0){throw 'SQLite migration validation failed'}
              "Installed desktop launch $relaunch authenticated in $($watch.ElapsedMilliseconds) ms" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }finally {
              if(-not $app.HasExited){$null=$app.CloseMainWindow();Start-Sleep -Milliseconds 750;$app.Refresh();if(-not $app.HasExited){$app.Kill($true);$app.WaitForExit()}}
            }
          }
          # Actual upgrade migration from 0.8 is NOT established by a clean install+restart test.
          "Windows clean install and restart: PASS. Upgrade: NOT TESTED. Real Ollama: NOT TESTED." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Remove test installation
        if: always()
        run: |
          if($env:V09_INSTALL_DIR -and (Test-Path $env:V09_INSTALL_DIR)){
            $uninstaller=@(Get-ChildItem $env:V09_INSTALL_DIR -Filter '*uninstall*.exe' -Recurse -ErrorAction SilentlyContinue)
            if($uninstaller.Count -gt 0){
              $p=Start-Process -FilePath $uninstaller[0].FullName -ArgumentList '/S' -Wait -PassThru
              if($p.ExitCode -ne 0){Write-Warning "Silent uninstall exit code: $($p.ExitCode)"}
            }else{Write-Warning 'Uninstaller not located; not verified'}
          }
      - name: Upload test logs and actual installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-v09-installer-source-and-test-evidence
          path: |
            python-test-results.xml
            AI-Interview-Studio-Source-v0.9.0.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/v09-worker-stderr.txt
          if-no-files-found: warn
