name: Windows RC4 installed WebView2 assessment and native upgrade acceptance
on:
  workflow_dispatch:
  push:
    branches: ["feature/overlay-first-foundation-rc4"]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact source, lockfile and toolchains
        run: |
          $ErrorActionPreference='Stop'
          foreach($required in @('apps/desktop/package-lock.json','apps/desktop/src-tauri/src/lib.rs','services/ai_worker/run_worker.py','services/ai_worker/app/startup_events.py','services/ai_worker/tests/test_v09.py','scripts/build.ps1')) {
            if(-not (Test-Path $required)){throw "Missing required file: $required"}
          }
          "Source commit: $env:GITHUB_SHA" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          node --version; npm --version; rustc --version; cargo --version; py -3.11 --version
      - name: Python dependencies
        run: |
          py -3.11 -m venv services/ai_worker/.venv
          & services/ai_worker/.venv/Scripts/python.exe -m pip install -r services/ai_worker/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'Python dependency installation failed'}
          & services/ai_worker/.venv/Scripts/python.exe -m pip install -r services/ai_worker/requirements-stt.txt
          if($LASTEXITCODE -ne 0){throw 'STT dependency installation failed'}
      - name: Python regression, real localhost restart and compilation
        run: |
          $env:PYTHONPATH='services/ai_worker'
          & services/ai_worker/.venv/Scripts/python.exe -m compileall -q services/ai_worker/app
          if($LASTEXITCODE -ne 0){throw 'Python compilation failed'}
          & services/ai_worker/.venv/Scripts/python.exe -m pytest services/ai_worker/tests -q --junitxml=python-test-results.xml
          if($LASTEXITCODE -ne 0){throw 'Python regression failed'}
      - name: Frontend locked dependencies and production build
        working-directory: apps/desktop
        run: |
          npm ci
          if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
          npm run build
          if($LASTEXITCODE -ne 0){throw 'TypeScript / React build failed'}
      - name: Rust compilation and unit tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check
          if($LASTEXITCODE -ne 0){throw 'cargo check failed'}
          cargo test
          if($LASTEXITCODE -ne 0){throw 'Rust tests failed'}
      - name: Package bundled worker and NSIS installer
        run: .\scripts\build.ps1
      - name: Authenticated packaged Python worker acceptance
        run: |
          $ErrorActionPreference='Stop'
          $worker='services/ai_worker/dist/ai-studio-worker.exe'
          if(-not (Test-Path $worker)){throw 'Packaged worker missing'}
          $listener=[System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,0)
          $listener.Start();$port=$listener.LocalEndpoint.Port;$listener.Stop()
          $env:STUDIO_PORT="$port"
          $env:STUDIO_WORKER_TOKEN='ci-only-secret-not-published'
          $env:STUDIO_DATA_DIR=Join-Path $env:RUNNER_TEMP 'AIStudioV09StandaloneData'
          $env:STUDIO_DIAGNOSTIC_DIR=Join-Path $env:RUNNER_TEMP 'AIStudioV09StandaloneLogs'
          $stderr=Join-Path $env:RUNNER_TEMP 'v09-worker-stderr.txt'
          $proc=Start-Process -FilePath (Resolve-Path $worker) -PassThru -RedirectStandardError $stderr
          try {
            $ready=$false;$stopwatch=[System.Diagnostics.Stopwatch]::StartNew()
            while($stopwatch.Elapsed.TotalSeconds -lt 35){
              $proc.Refresh()
              if($proc.HasExited){throw "Packaged worker exited before readiness: $($proc.ExitCode)"}
              try {
                $bad=Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -SkipHttpErrorCheck -TimeoutSec 2
                if([int]$bad.StatusCode -ne 401){throw 'Unauthenticated health request was not rejected'}
                $r=Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -Headers @{'X-Studio-Token'=$env:STUDIO_WORKER_TOKEN} -TimeoutSec 2
                if($r.status -eq 'ok' -and $r.version -eq '1.0.0-rc.4'){$ready=$true;break}
              }catch {
                if($_.Exception.Message -match 'Unauthenticated health'){throw}
              }
              Start-Sleep -Milliseconds 250
            }
            if(-not $ready){throw 'Packaged worker did not complete authenticated readiness'}
            if(-not (Test-Path (Join-Path $env:STUDIO_DATA_DIR 'studio.sqlite3'))){throw 'Worker SQLite missing'}
            $events=Get-Content (Join-Path $env:STUDIO_DIAGNOSTIC_DIR 'worker-startup.jsonl') -Raw
            if($events -notmatch 'database_initialized'){throw 'No worker database initialization event'}
            if($events -match [regex]::Escape($env:STUDIO_WORKER_TOKEN)){throw 'Worker diagnostics leaked auth token'}
            # Execute the actual packaged worker API against its real SQLite database.
            # This verifies a scoped assessment workflow, not automated WebView interaction.
            $headers=@{'X-Studio-Token'=$env:STUDIO_WORKER_TOKEN}
            $base="http://127.0.0.1:$port"
            $quiz=@{title='Windows packaged assessment smoke';duration_seconds=120;require_start=$true;negative_marking=0.5;cutoff_pct=75;
              questions=@(
                @{id='a';stem='First choice';kind='single';correct='B';options=@(@{label='A';text='Wrong'},@{label='B';text='Right'})},
                @{id='b';stem='Second choice';kind='single';correct='A';options=@(@{label='A';text='Right'},@{label='B';text='Wrong'})}
              )} | ConvertTo-Json -Depth 8
            $created=Invoke-RestMethod -Method Post -Uri "$base/api/assessments" -Headers $headers -ContentType 'application/json' -Body $quiz
            $aid=$created.id
            if(-not $aid){throw 'Cannot create packaged-worker assessment'}
            $clock=(Invoke-RestMethod -Method Post -Uri "$base/api/assessments/$aid/start" -Headers $headers).draft.started
            if(-not $clock){throw 'No server-owned assessment start'}
            $draft=@{started=$clock;answers=@{a='B'};review=@('b')} | ConvertTo-Json -Depth 5
            $null=Invoke-RestMethod -Method Post -Uri "$base/api/assessments/$aid/draft" -Headers $headers -ContentType 'application/json' -Body $draft
            $submit=@{started=$clock;answers=@{a='B';b='B'};negative_marking=0} | ConvertTo-Json -Depth 5
            $graded=Invoke-RestMethod -Method Post -Uri "$base/api/assessments/$aid/submit" -Headers $headers -ContentType 'application/json' -Body $submit
            if([double]$graded.score -ne 0.5 -or [double]$graded.negative_marking -ne 0.5 -or $graded.passed_cutoff -ne $false){throw 'Packaged assessment grading policy failed'}
            $retry=Invoke-RestMethod -Method Post -Uri "$base/api/assessments/$aid/submit" -Headers $headers -ContentType 'application/json' -Body $submit
            if(-not $retry.duplicate_submission -or $retry.attempt_id -ne $graded.attempt_id){throw 'Packaged assessment receipt was not idempotent'}
            "Windows packaged-worker strict timed assessment API: PASS (real SQLite)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "Packaged worker authenticated readiness: $($stopwatch.ElapsedMilliseconds) ms" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }finally {
            if(-not $proc.HasExited){$proc.Kill($true);$proc.WaitForExit()}
            Remove-Item Env:STUDIO_WORKER_TOKEN -ErrorAction SilentlyContinue
          }
      - name: Generate exact-commit source and validate installer
        run: |
          git archive --format=zip HEAD -o AI-Interview-Studio-RC4-Canonical-Source.zip
          if($LASTEXITCODE -ne 0){throw 'Canonical source ZIP failed'}
          # Source members remain the exact Git HEAD. A generated, separately
          # identified manifest supplies reproducibility/evidence metadata.
          $checkpoint=@{
            schema='studio-source-checkpoint-v1'
            branch=$env:GITHUB_REF_NAME
            git_commit=$env:GITHUB_SHA
            application_version='1.0.0-rc.4'
            created_utc=[DateTimeOffset]::UtcNow.ToString('o')
            source='git archive HEAD plus this manifest'
            test_evidence=@{
              workflow_run="$env:GITHUB_RUN_ID"
              python_stage='See exact-run Python test-results.xml'
              react_rust_build='See exact-run CI steps'
              installed_webview='Pending later acceptance step; do not infer PASS'
              real_ollama='Separate Linux Ollama acceptance only'; overlay_tray='Pending later acceptance step'
            }
          }
          $checkpoint | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 RC4_CHECKPOINT_MANIFEST.json
          & py -3.11 -c "import zipfile; p='AI-Interview-Studio-RC4-Canonical-Source.zip'; z=zipfile.ZipFile(p,'a',compression=zipfile.ZIP_DEFLATED); z.write('RC4_CHECKPOINT_MANIFEST.json','RC4_CHECKPOINT_MANIFEST.json'); z.close(); z=zipfile.ZipFile(p); bad=z.testzip(); assert bad is None,bad; assert 'RC4_CHECKPOINT_MANIFEST.json' in z.namelist(); print('RC4 exact-commit ZIP manifest and CRC: PASS')"
          if($LASTEXITCODE -ne 0){throw 'Source ZIP manifest or CRC verification failed'}
          $sourceHash=(Get-FileHash AI-Interview-Studio-RC4-Canonical-Source.zip -Algorithm SHA256).Hash
          "RC4 exact-commit source SHA256 $sourceHash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Host "RC4_SOURCE_SHA256=$sourceHash"
          $exes=@(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if($exes.Count -lt 1){throw 'No actual NSIS installer produced'}
          $exes | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "Windows NSIS: $($_.Name) SHA256 $hash" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Write-Host "NSIS_SHA256=$hash"
          }
      - name: RC4 NSIS clean install, upgrade, crash recovery and uninstall acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $installer=@(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1)
          if($installer.Count -ne 1){throw 'RC4 installer missing'}
          & .\\scripts\\rc4-windows-acceptance.ps1 -CurrentInstaller $installer[0].FullName
          if($LASTEXITCODE -ne 0){throw 'RC4 installed-app acceptance script failed'}
      - name: Install WebView2 CDP GUI automation client
        run: |
          py -3.11 -m pip install playwright==1.58.0
          if($LASTEXITCODE -ne 0){throw 'Playwright package installation failed'}
          # Do not install Chromium; Playwright connects to the actual installed WebView2.
      - name: Installed Windows overlay-first tray, shortcuts, workspace and worker acceptance
        run: |
          $ErrorActionPreference='Stop'
          $installer=@(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1)
          if($installer.Count -ne 1){throw 'RC4 installer missing'}
          $dest=Join-Path $env:RUNNER_TEMP 'AI Studio RC4 Overlay GUI Test'
          $p=Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S',"/D=$dest") -PassThru -Wait
          if($p.ExitCode -ne 0){throw 'Cannot install RC4 desktop for overlay GUI test'}
          $app=@(Get-ChildItem -LiteralPath $dest -Filter 'ai-interview-studio.exe' -Recurse | Select-Object -First 1)
          if($app.Count -ne 1){throw 'Installed desktop binary missing'}
          & py -3.11 .\scripts\rc4-overlay-acceptance.py --installed-exe $app[0].FullName --report (Join-Path $env:RUNNER_TEMP 'rc4-overlay-acceptance.json')
          if($LASTEXITCODE -ne 0){throw 'Installed overlay-first acceptance failed'}
          $un=@(Get-ChildItem -LiteralPath $dest -Filter '*uninstall*.exe' -Recurse | Select-Object -First 1)
          if($un.Count -ne 1){throw 'Overlay test uninstaller missing'}
          $p=Start-Process -FilePath $un[0].FullName -ArgumentList '/S' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Overlay test uninstall failed'}
          "Installed RC4 overlay-first lifecycle: PASS" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Upload test logs and actual installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc4-installer-source-and-windows-acceptance
          path: |
            python-test-results.xml
            AI-Interview-Studio-RC4-Canonical-Source.zip
            RC4_CHECKPOINT_MANIFEST.json
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/Cargo.lock
            ${{ runner.temp }}/v09-worker-stderr.txt
            ${{ runner.temp }}/rc4-windows-acceptance.json
            ${{ runner.temp }}/rc4-overlay-acceptance.json
            ${{ runner.temp }}/rc4-overlay-failure.png
          if-no-files-found: warn
