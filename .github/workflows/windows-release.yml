name: Windows native build and installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify source import
        run: |
          @('apps/desktop/package.json','apps/desktop/src-tauri/Cargo.toml','services/ai_worker/requirements.txt','scripts/build.ps1') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing source file: $_. Import the full v0.3.0 source ZIP before running CI." }
          }
      - name: Verify toolchains
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          py -3.11 --version
      - name: Install and test Python worker
        run: |
          py -3.11 -m venv services/ai_worker/.venv
          & services/ai_worker/.venv/Scripts/python.exe -m pip install -r services/ai_worker/requirements.txt
          $env:PYTHONPATH = 'services/ai_worker'
          & services/ai_worker/.venv/Scripts/python.exe -m pytest services/ai_worker/tests -q --junitxml=python-test-results.xml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: |
          if (-not (Test-Path package-lock.json)) { throw 'A committed package-lock.json is required for reproducible npm ci builds.' }
          npm ci
      - name: Build React UI
        working-directory: apps/desktop
        run: npm run build
      - name: Rust checks
        working-directory: apps/desktop/src-tauri
        run: |
          cargo check
          cargo test
      - name: Build Windows installer
        run: .\scripts\build.ps1
      - name: Validate produced NSIS installer
        run: |
          $exes = @(Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) { throw 'No NSIS installer produced.' }
          $exes | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-artifacts-and-logs
          path: |
            python-test-results.xml
            apps/desktop/dist/
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
